name: publish

# 通过 npm Trusted Publishing (OIDC) 发布，不需要 NPM_TOKEN，也不需要 OTP。
# 前置：在 npmjs.com 的包设置里配置 Trusted Publisher →
#   Organization or user: yangweijie
#   Repository: typephp-skills
#   Workflow filename: publish.yml
# 配置后必须在 2 天内完成首次发布，否则配置过期需重建。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write # OIDC，必需
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 package.json 版本 ${expected} 不一致"
            exit 1
          fi

      - name: 打包内容自检
        run: npm pack --dry-run

      - name: 发布到 npm
        run: npm publish --access public
